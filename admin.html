<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="dashboard.html"><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><a class="button" href="dashboard.html">DASHBOARD</a></header><main class="center"><section class="box"><small>SHARDNOTE / ADMIN</small><h1>ADMIN PANEL</h1><p id="status">Checking authorization...</p><div id="panel" style="display:none"><div id="admin-stats" class="member-row">Loading stats...</div><h2>SUPPORT</h2><div id="tickets">Loading...</div><h2>MANAGE ADMINS</h2><input id="admin-search" placeholder="Search username..." autocomplete="off"><div id="admin-results"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user)return;const expected="admin-"+user.id+".html";if(location.pathname.split("/").pop()!==expected){document.getElementById("status").textContent="Access denied: this admin URL belongs to a different user.";return;}const {data:me}=await sb.from("team_members").select("role").eq("user_id",user.id).maybeSingle();if(!me||!["owner","admin"].includes(me.role)){document.getElementById("status").textContent="Access denied: admin role required.";return;}document.getElementById("status").textContent="Authorized.";document.getElementById("panel").style.display="block";const {data:stats}=await sb.rpc("admin_stats");document.getElementById("admin-stats").textContent=stats?"ONLINE: "+stats.online+" · SIGNED IN: "+stats.signed_in:"Stats unavailable";const {data:t}=await sb.from("support_tickets").select("subject,message,status,created_at").order("created_at",{ascending:false}).limit(30);document.getElementById("tickets").innerHTML=(t||[]).map(x=>"<div class='member-row'><strong>"+String(x.subject).replace(/[&<>]/g,"")+"</strong><small>"+String(x.message).replace(/[&<>]/g,"")+"</small><span>"+x.status.toUpperCase()+"</span></div>").join("")||"No tickets.";const input=document.getElementById("admin-search"),out=document.getElementById("admin-results");let timer;input.oninput=()=>{clearTimeout(timer);const q=input.value.trim();if(!q){out.innerHTML="";return;}timer=setTimeout(async()=>{const {data}=await sb.rpc("search_team_users",{search_term:q});out.innerHTML=(data||[]).slice(0,8).map(x=>"<div class='member-row'><strong>"+String(x.username).replace(/[&<>]/g,"")+"</strong><span>"+String(x.role).toUpperCase()+" <button class='button make-admin' data-id='"+x.user_id+"'>MAKE ADMIN</button></span></div>").join("")||"No users found.";out.querySelectorAll(".make-admin").forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc("admin_set_role",{target_user:b.dataset.id,new_role:"admin"});b.textContent=error?"FAILED":"ADMIN";});},180);};})();</script></body></html>
