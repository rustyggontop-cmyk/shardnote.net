<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="dashboard.html"><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><a class="button" href="dashboard.html">DASHBOARD</a></header><main class="center"><section class="box"><small>SHARDNOTE / ADMIN</small><h1>ADMIN PANEL</h1><p id="status">Checking authorization...</p><div id="panel" style="display:none"><div id="admin-stats" class="member-row">Loading stats...</div><div id="owner-invite" style="display:none" class="invitebox"><label>ADMIN INVITE</label><strong>676767</strong><small>Owner admin code</small></div><div id="admin-members"></div><h2>SUPPORT</h2><div id="tickets">Loading...</div><h2 id="manage-admins-title">MANAGE ADMINS</h2><input id="admin-search" placeholder="Search username..." autocomplete="off"><div id="admin-results"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:me}=await sb.from("team_members").select("role").eq("user_id",user.id).maybeSingle();if(!me||!["owner","admin"].includes(me.role)){document.getElementById("status").textContent="Access denied: admin role required.";return;}document.getElementById("status").textContent="Authorized.";document.getElementById("panel").style.display="block";if(me.role==="owner")document.getElementById("owner-invite").style.display="block";const {data:stats}=await sb.rpc("admin_stats");document.getElementById("admin-stats").textContent=stats?"ONLINE: "+stats.online+" · SIGNED IN: "+stats.signed_in:"Stats unavailable";
const {data:members}=await sb.from("team_members").select("user_id,username,role").order("username"); const ids=(members||[]).map(x=>x.user_id); const {data:tags}=ids.length?await sb.from("user_tags").select("user_id,tag_name,color").in("user_id",ids):{data:[]}; const tm=Object.fromEntries((tags||[]).map(x=>[x.user_id,x])); const pres=ids.length?await sb.from("user_presence").select("user_id,last_seen").in("user_id",ids):{data:[]}; const pm=Object.fromEntries((pres.data||[]).map(x=>[x.user_id,x])); document.getElementById("admin-members").innerHTML="<h2>TEAM MEMBERS</h2>"+(members||[]).map(m=>{const t=tm[m.user_id],p=pm[m.user_id],online=p&&Date.now()-new Date(p.last_seen).getTime()<300000;return "<div class='member-row'><strong>"+String(m.username).replace(/[&<>]/g,"")+"</strong>"+(t?"<span class='user-tag' style='display:inline-flex;align-items:center;justify-content:center;margin-left:6px;padding:0 4px;height:18px;line-height:16px;border-radius:4px;font-size:13px;font-weight:800;white-space:nowrap;vertical-align:middle;box-sizing:border-box;border:1px solid "+t.color+";color:"+t.color+";background:"+t.color+"22'>"+String(t.tag_name).replace(/[&<>]/g,"")+"</span>":"")+"<span>"+m.role.toUpperCase()+" · "+(online?"ONLINE":"OFFLINE")+"</span><button class='button reset-pass' data-user='"+m.user_id+"'>RESET PASSWORD</button></div>"}).join(""); document.querySelectorAll(".reset-pass").forEach(b=>b.onclick=async()=>{b.disabled=true;const {data:{session}}=await sb.auth.getSession();const r=await fetch(window.SUPABASE_URL+"/functions/v1/admin-reset-password",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({user_id:b.dataset.user,redirectTo:location.origin+"/reset-password.html"})});const d=await r.json();b.textContent=d.ok?"RESET SENT":"FAILED";});const {data:t}=await sb.from("support_tickets").select("subject,message,status,created_at").order("created_at",{ascending:false}).limit(30);document.getElementById("tickets").innerHTML=(t||[]).map(x=>"<div class='member-row'><strong>"+String(x.subject).replace(/[&<>]/g,"")+"</strong><small>"+String(x.message).replace(/[&<>]/g,"")+"</small><span>"+x.status.toUpperCase()+"</span></div>").join("")||"No tickets.";if(me.role!=="owner"){document.getElementById("manage-admins-title").style.display="none";document.getElementById("admin-search").style.display="none";} const input=document.getElementById("admin-search"),out=document.getElementById("admin-results");let timer;input.oninput=()=>{clearTimeout(timer);const q=input.value.trim();if(!q){out.innerHTML="";return;}timer=setTimeout(async()=>{const {data}=await sb.rpc("search_team_users",{search_term:q});out.innerHTML=(data||[]).slice(0,8).map(x=>"<div class='member-row'><strong>"+String(x.username).replace(/[&<>]/g,"")+"</strong><span>"+String(x.role).toUpperCase()+" <button class='button make-admin' data-id='"+x.user_id+"' "+(me.role!=="owner"?"disabled":"")+">MAKE ADMIN</button></span></div>").join("")||"No users found.";out.querySelectorAll(".make-admin").forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc("admin_set_role",{target_user:b.dataset.id,new_role:"admin"});b.textContent=error?"FAILED":"ADMIN";});},180);};})();</script></body></html>
