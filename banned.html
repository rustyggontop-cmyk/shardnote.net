<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Restricted — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body><main class="center"><section class="box"><small>SHARDNOTE / MODERATION</small><h1>ACCOUNT RESTRICTED</h1><p>Your account is currently banned from SHARDNOTE.</p><p id="reason"></p><button id="logout" class="button orange">LOG OUT</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html";return;}const {data}=await sb.from("user_bans").select("reason,created_at").eq("user_id",user.id).maybeSingle();if(!data){location.href="dashboard.html";return;}document.getElementById("reason").textContent="Reason: "+String(data.reason||"Not specified");document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="index.html";};})().catch(()=>{});</script></body></html>
