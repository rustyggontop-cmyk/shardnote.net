<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Restricted — SHARDNOTE</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js?v=4"></script></head><body><div class="release-banner"><strong>We've released!! 🥳</strong></div><main class="center"><section class="box"><img src="/logo.png" class="site-logo" alt="SHARDNOTE logo" style="margin:0 auto 14px"><small>SHARDNOTE / MODERATION</small><h1>ACCOUNT RESTRICTED</h1><p>Your account is currently banned from SHARDNOTE.</p><p id="reason"></p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><a href="/support/" class="button orange">CONTACT SUPPORT</a><button id="logout" class="button">LOG OUT</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/realtime.js"></script><script>(async()=>{const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user){location.href="/login/";return;}const {data}=await sb.from("user_bans").select("reason,created_at").eq("user_id",user.id).maybeSingle();if(!data){location.href="/dashboard/";return;}document.getElementById("reason").textContent="Reason: "+String(data.reason||"Not specified");
shardnoteLive(sb,[{table:"user_bans"}],payload=>{
  if(payload.eventType==="DELETE"&&payload.old?.user_id===user.id) location.href="/dashboard/";
  if(payload.eventType==="INSERT"&&payload.new?.user_id===user.id) location.reload();
});document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="/";};})().catch(()=>{});</script><script src="/site-settings.js"></script>
</body></html>
