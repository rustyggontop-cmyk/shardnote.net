<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spinning Cat — SHARDNOTE</title>
<style>
html,body{margin:0;min-height:100%;background:#0b0712;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{text-align:center;padding:30px}
.cat{width:min(420px,80vw);height:min(420px,80vw);object-fit:contain;animation:spin 2.2s linear infinite;filter:drop-shadow(0 0 25px rgba(168,85,247,.45))}
h1{font-size:clamp(28px,5vw,48px);margin:24px 0 8px}
p{color:#c4b5fd;font-size:18px;margin:0}#sound{margin-top:18px;padding:10px 18px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
</head>
<body>
<div class="wrap">
<img class="cat" src="/top-secret/maxwell.gif" alt="Maxwell spinning">
<h1>You found the spinning Maxwell! 🐈</h1>
<p>Have fun! :3 ps dont anger him.</p><button id="sound" type="button">🔊 Play Maxwell</button>
</div>
<audio id="maxwell-audio" preload="auto" loop><source src="/top-secret/maxwell.mp3" type="audio/mpeg"></audio><script>const a=document.getElementById("maxwell-audio"),b=document.getElementById("sound");b.addEventListener("click",async()=>{try{await a.play();b.textContent="🔊 Maxwell is playing";}catch(e){b.textContent="⚠️ Audio could not play";console.error(e);}});</script><div id="reward" style="margin-top:18px;color:#c4b5fd;font-size:14px"></div>
<script>
(async function(){
 const reward=document.getElementById("reward");
 try{
  const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){reward.textContent="Log in to Shardnote to unlock your second custom tag!";return;}
  const {error}=await sb.from("profiles").update({cat_found:true}).eq("id",session.user.id);
  if(error) throw error;
  reward.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:99998;padding:20px"><div style="max-width:430px;width:100%;background:#15101f;border:1px solid #7c3aed;border-radius:18px;padding:28px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.6)"><div style="font-size:46px">🐈</div><h2 style="margin:10px 0 8px">You found the secret cat!</h2><p style="color:#c4b5fd;line-height:1.5">🎉 You unlocked a second custom tag slot. Create your new tag now!</p><button id="create-secret-tag" type="button" style="margin-top:10px;padding:12px 22px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer">Create My Tag</button></div></div>';
document.getElementById("create-secret-tag")?.addEventListener("click",()=>location.href="/");
 }catch(e){console.error(e);reward.textContent="Could not unlock the second tag. Please try again."; }
})();
</script>
</body>
</html>
