<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="index.html"><img src="logo.png" alt="SHARDNOTE logo" class="site-logo" onerror="this.style.display='inline-block'">CS<span>2</span><b> SHARDNOTE</b></a><button id="logout" class="button">LOGOUT</button></header>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><main class="center"><section class="box"><small>SHARDNOTE / CLAN</small><h1>TEAM DASHBOARD</h1><p id="member">Loading...</p><hr><h2>TEAM MEMBERS</h2><div id="members">Loading team...</div><section class="box tag-panel"><small>SHARDNOTE / IDENTITY</small><h2>YOUR TAG</h2><p id="tag-status">Loading tag...</p><div id="tag-create" style="display:none"><input id="tag-name" maxlength="24" placeholder="Tag name"><div style="display:flex;gap:10px;align-items:center"><input id="tag-color" type="color" value="#A970FF" style="width:64px;height:44px;padding:2px"><button id="create-tag" class="button orange">CREATE TAG</button></div></div><div id="tag-preview"></div></section><hr><h2>INVITES</h2><p id="invite-status">Checking invite status...</p><div id="owner-panel" style="display:none"><hr><h2>OWNER CONTROLS</h2><h3>INVITE CODES</h3><div id="invite-codes">Loading...</div><h3>SEARCH / MANAGE TEAM</h3><input id="user-search" placeholder="Search username"><button id="search-users" class="button orange">SEARCH</button><div id="user-results"></div></div></section></main>
<script src="supabase-config.js"></script>
<script>
(function(){
  // Never render dashboard content until auth.js confirms an authenticated session.
  document.documentElement.style.visibility="hidden";
  window.__shardnote_auth_required=true;
})();
</script>
<script src="auth.js"></script>
<script>
(async()=>{
 const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
 const {data:{user}}=await sb.auth.getUser(); if(!user)return;
 const {data:tag}=await sb.from("user_tags").select("tag_name,color").eq("user_id",user.id).maybeSingle();
 const ts=document.getElementById("tag-status"), tc=document.getElementById("tag-create"), tp=document.getElementById("tag-preview");
 if(tag){ts.textContent="Your tag";tp.innerHTML="<span style='display:inline-block;padding:7px 12px;border-radius:999px;background:"+tag.color+"22;border:1px solid "+tag.color+";color:"+tag.color+";font-weight:900'>"+String(tag.tag_name).replace(/[&<>]/g,"")+"</span>";}
 else {ts.textContent="You can create one custom tag. You can choose any color.";tc.style.display="block";document.getElementById("create-tag").onclick=async()=>{const name=document.getElementById("tag-name").value.trim(),color=document.getElementById("tag-color").value;const {data,error}=await sb.rpc("create_my_tag",{p_name:name,p_color:color});if(error){ts.textContent=error.message;return;}ts.textContent="Tag created.";tp.innerHTML="<span style='display:inline-block;padding:7px 12px;border-radius:999px;background:"+data.color+"22;border:1px solid "+data.color+";color:"+data.color+";font-weight:900'>"+String(data.tag_name).replace(/[&<>]/g,"")+"</span>";tc.style.display="none";};}
 const {data:team,error:teamError}=await sb.from("team_members").select("user_id,username,role").order("username");
 const {data:tags}=await sb.from("user_tags").select("user_id,tag_name,color");
 const tagMap=Object.fromEntries((tags||[]).map(t=>[t.user_id,t]));
 document.getElementById("members").innerHTML=teamError ? "Could not load team." : (team||[]).map(m=>{const t=tagMap[m.user_id]; const tag=t ? "<span style='display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:"+t.color+"22;border:1px solid "+t.color+";color:"+t.color+";font-size:11px;font-weight:800'>"+String(t.tag_name).replace(/[&<>]/g,"")+"</span>" : ""; return "<div class='member-row'><strong>"+String(m.username).replace(/[&<>]/g,"")+"</strong>"+tag+"<span>"+String(m.role).toUpperCase()+"</span></div>";}).join("");
 const {data:me}=await sb.from("team_members").select("role").eq("user_id",user.id).maybeSingle();
 const {data:weekly}=await sb.rpc("my_weekly_invites");
 document.getElementById("invite-status").innerHTML=(weekly||[]).length ? "Your 5 unique invite codes for this week:" : "Your weekly invite codes are being generated.";
 document.getElementById("invite-codes").innerHTML=(weekly||[]).map(x=>"<div class='invitebox'><label>ONE-TIME INVITE</label><strong>"+x.code+"</strong><small>1 use · expires "+new Date(x.valid_until).toLocaleDateString()+"</small></div>").join("");
 if(me?.role==="owner"){
  document.getElementById("owner-panel").style.display="block";
  const {data:inv,error:ie}=await sb.rpc("owner_list_invites");
  document.getElementById("invite-codes").innerHTML += "<hr><h3>ADMIN CODE</h3><div class='invitebox'><label>OWNER ADMIN INVITE</label><strong>676767</strong><small>Admin code</small></div>";
  const searchBtn=document.getElementById("search-users"), input=document.getElementById("user-search"), results=document.getElementById("user-results");
  searchBtn.onclick=async()=>{
   const q=input.value.trim(); if(!q){results.textContent="Enter a username.";return;}
   const {data,error}=await sb.rpc("search_team_users",{search_term:q});
   if(error){results.textContent="Search failed: "+error.message;return;}
   results.innerHTML=(data||[]).map(u=>"<div class='member-row'><strong>"+String(u.username).replace(/[&<>]/g,"")+"</strong><span>"+u.role.toUpperCase()+" <button class='button' data-user='"+encodeURIComponent(u.username)+"'>ADD / UPDATE</button></span></div>").join("")||"No users found.";
   results.querySelectorAll("button[data-user]").forEach(b=>b.onclick=async()=>{
    const username=decodeURIComponent(b.dataset.user);
    const {error}=await sb.rpc("owner_add_team_member",{target_username:username,new_role:"member"});
    results.lastElementChild.textContent=error?"Update failed: "+error.message:username+" added/updated as member.";
   });
  };
 }})();
</script></body></html>
