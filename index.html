<body><header><a class="brand" href="/"><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><nav id="nav"><a href="/socials/">SOCIALS</a><a href="/login/">LOGIN</a><a class="orange" href="/register/">REGISTER</a></nav></header>
<script src="supabase-config.js"></script><main><div class="hero"><img src="logo.png" class="hero-logo" alt="SHARDNOTE logo"><small>COUNTER-STRIKE 2</small><p>Competitive. Private. Built for the squad.</p><div id="hero-actions"><a class="button orange" href="/register/">JOIN THE CLAN</a><a class="button" href="/login/">LOGIN</a></div></div></main><script>
(async()=>{
 const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
 const {data:{session}}=await sb.auth.getSession();
 const nav=document.getElementById("nav"), actions=document.getElementById("hero-actions");
 if(session){
   nav.innerHTML='<a class="button orange" href="/dashboard/">DASHBOARD</a>';
   actions.innerHTML='<a class="button orange" href="/dashboard/">GO TO DASHBOARD</a>';
 }
})();
</script>
<script src="auth.js"></script><footer class="site-footer">Shardnote ™️ 2026 — All rights reserved to Shardnote.net</footer>

<script>
(function(){
 if(localStorage.getItem("shardnote_cookie_consent")==="accepted") return;
 const box=document.createElement("div");
 box.id="shardnote-cookie-consent";
 box.innerHTML='<div style="position:fixed;left:20px;right:20px;bottom:20px;z-index:99999;max-width:720px;margin:auto;padding:18px 20px;background:#111827;border:1px solid #374151;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);color:#fff;font-family:inherit"><div style="font-size:17px;font-weight:700;margin-bottom:6px">🍪 We use cookies</div><div style="font-size:14px;line-height:1.5;color:#cbd5e1">Shardnote uses cookies and local storage to keep you signed in, remember your preferences, and make the site work properly.</div><button id="shardnote-cookie-accept" type="button" style="margin-top:12px;padding:9px 18px;border:0;border-radius:9px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer">Accept</button></div>';
 document.body.appendChild(box);
 document.getElementById("shardnote-cookie-accept").onclick=function(){localStorage.setItem("shardnote_cookie_consent","accepted");box.remove();};
})();
</script>
</body></html>
