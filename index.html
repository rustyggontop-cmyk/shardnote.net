<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHARDNOTE — CS2 Clan</title><link rel="stylesheet" href="style.css"></head>
<body><div class="release-banner"><strong>We've released!! 🥳</strong></div>
<header><a class="brand" href="/""><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><nav id="nav"><a href="/socials/"">SOCIALS</a><a href="/login/"">LOGIN</a><a class="orange" href="/register/"">REGISTER</a></nav></header>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><main><div class="hero"><img src="logo.png" class="hero-logo" alt="SHARDNOTE logo"><small>COUNTER-STRIKE 2</small><p>Competitive. Private. Built for the squad.</p><div id="hero-actions"><a class="button orange" href="/register/"">JOIN THE CLAN</a><a class="button" href="/login/"">LOGIN</a></div></div></main><script>
(async()=>{
 const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
 const {data:{session}}=await sb.auth.getSession();
 const nav=document.getElementById("nav"), actions=document.getElementById("hero-actions");
 if(session){
   nav.innerHTML='<a class="button orange" href="/dashboard/"">DASHBOARD</a>';
   actions.innerHTML='<a class="button orange" href="/dashboard/"">GO TO DASHBOARD</a>';
 }
 document.documentElement.style.visibility="visible";
})();
</script>
<script src="auth.js"></script><footer class="site-footer">Shardnote ™️ 2026 — All rights reserved to Shardnote.net</footer>
<div id="live-status" class="live-status" role="status" aria-live="polite">Checking status...</div><script>
(async()=>{
 const el=document.getElementById("live-status");
 const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
 let last="";
 async function update(){
   try{
     const result=await sb.rpc("get_service_statuses"); const data=result.data,error=result.error;
     if(error) throw error;
     const services=Array.isArray(data)?data:[];
     const down=services.filter(x=>x.manually_disabled);
     const next=down.length?("Some services are currently down · "+down.map(x=>x.display_name).join(", ")):"All systems operational";
     if(next!==last){el.textContent=next;last=next}
     el.classList.toggle("down",down.length>0);
   }catch(e){el.textContent="Status unavailable"; last="Status unavailable"}
 }
 await update();
 setInterval(update,2000);
 try{
   sb.channel("live-service-status-"+Date.now())
    .on("postgres_changes",{event:"*",schema:"public",table:"service_status"},()=>update())
    .subscribe();
 }catch(e){}
})();
</script></script>
</body></html>
