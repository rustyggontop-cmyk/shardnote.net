<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="index.html"><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a></header>
<main class="center"><form class="box" id="login" autocomplete="on">
<small>SHARDNOTE / MEMBER</small><h1>LOGIN</h1>
<input id="username" type="text" placeholder="Username" required minlength="3" autocomplete="username">
<input id="password" type="password" placeholder="Password" required autocomplete="current-password">
<button id="login-btn" class="button orange" type="submit">LOGIN</button>
<p id="msg"></p>
<div class="account-made"><strong>Sign in securely</strong><span>Use the password you created when you joined SHARDNOTE.</span></div>
<a href="register.html">Need an account? Create one</a>
</form></main>
<script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
