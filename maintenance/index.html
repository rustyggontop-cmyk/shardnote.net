<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance — SHARDNOTE</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="release-banner"><strong>SHARDNOTE</strong></div>
<header>
  <a class="brand" href="/"><img src="/logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a>
</header>
<main class="center">
  <section class="box maintenance-card">
    <img src="/logo.png" class="site-logo" alt="SHARDNOTE logo" style="margin:0 auto 18px;width:58px;height:58px">
    <small>SHARDNOTE / MAINTENANCE</small>
    <h1>WE'LL BE RIGHT BACK</h1>
    <p>SHARDNOTE is temporarily unavailable while we work on the site.</p>
    <p id="maintenance-message" class="support-note">Only the Site Owner and Co-owner can access SHARDNOTE during maintenance.</p>
    <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px">
      <a class="button orange" href="/login/">STAFF LOGIN</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
(async()=>{
  const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
  const {data:{user}}=await sb.auth.getUser();
  if(user){
    const {data:role}=await sb.rpc("current_user_role");
    if(role==="owner"||role==="co_owner"){
      document.getElementById("maintenance-message").textContent="You have staff access. Open the dashboard to continue managing SHARDNOTE.";
      const a=document.querySelector('.maintenance-card a.button');
      a.textContent="GO TO DASHBOARD";
      a.href="/dashboard/";
    }
  }
})();
</script>
</body>
</html>
