<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join — SHARDNOTE</title><link rel="stylesheet" href="/style.css"><script src="/supabase-config.js?v=3"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/site-gate.js?v=5"></script><script src="/i18n.js?v=4"></script></head>
<body><header><a class="brand" href="/"><img src="/logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a></header><main class="center"><form class="box" id="register"><small>SHARDNOTE / CREATE ACCOUNT</small><h1>CREATE ACCOUNT</h1><input id="username" placeholder="Username" required minlength="3"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required minlength="8"><button class="button orange">CREATE ACCOUNT</button><p id="msg"></p><a href="/login/">Already a member? Login</a></form></main><script src="/auth.js"></script><script>
(function(){
 if(localStorage.getItem("shardnote_cookie_consent")==="accepted") return;
 const box=document.createElement("div");
 box.id="shardnote-cookie-consent";
 box.innerHTML='<div style="position:fixed;left:20px;right:20px;bottom:20px;z-index:99999;max-width:720px;margin:auto;padding:18px 20px;background:#111827;border:1px solid #374151;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);color:#fff;font-family:inherit"><div style="font-size:17px;font-weight:700;margin-bottom:6px">🍪 We use cookies</div><div style="font-size:14px;line-height:1.5;color:#cbd5e1">Shardnote uses cookies and local storage to keep you signed in, remember your preferences, and make the site work properly.</div><button id="shardnote-cookie-accept" type="button" style="margin-top:12px;padding:9px 18px;border:0;border-radius:9px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer">Accept</button></div>';
 document.body.appendChild(box);
 document.getElementById("shardnote-cookie-accept").onclick=function(){localStorage.setItem("shardnote_cookie_consent","accepted");box.remove();};
})();
</script>
</body></html>
