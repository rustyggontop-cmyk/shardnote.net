<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — SHARDNOTE</title><link rel="stylesheet" href="/style.css"></head><body><div class="release-banner"><strong>We've released!! 🥳</strong></div><header><a class="brand" href="/dashboard/"><img src="/logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a></header><main class="center"><form class="box" id="reset"><small>SHARDNOTE / SECURITY</small><h1>RESET PASSWORD</h1><input id="password" type="password" minlength="8" placeholder="New password" required><input id="confirm" type="password" minlength="8" placeholder="Confirm new password" required><button class="button orange">UPDATE PASSWORD</button><p id="msg"></p><a href="/login/">Back to login</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById("msg").textContent="This reset link is invalid or expired.";return;}document.getElementById("reset").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("msg"),p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p!==c){msg.textContent="Passwords do not match.";return;}if(p.length<8){msg.textContent="Password must be at least 8 characters.";return;}const {error}=await sb.auth.updateUser({password:p});if(error){msg.textContent="Password update failed: "+error.message;return;}msg.textContent="Password updated. Redirecting to dashboard...";setTimeout(()=>location.href="/dashboard/",700);};})();</script><script src="/site-settings.js"></script>
</body></html>
