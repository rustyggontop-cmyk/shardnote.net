<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Socials • SHARDNOTE</title>
<link rel="stylesheet" href="/style.css">
<style>
.social-page{min-height:calc(100vh - 74px);padding:60px 7%;display:grid;place-items:center}
.social-wrap{width:min(760px,100%);text-align:center}
.social-wrap h1{font-size:clamp(42px,7vw,76px);margin:12px 0}
.social-wrap p{color:#9890a8;margin:0 auto 28px;max-width:560px}
.social-card{display:flex;align-items:center;justify-content:space-between;gap:20px;text-align:left;padding:24px;background:#100d1d;border:1px solid #282039;border-radius:14px}
.social-name{display:flex;align-items:center;gap:16px}
.social-icon{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:#080611;border:1px solid #303641;font-size:23px;font-weight:900}
.social-card strong{display:block;color:#fff;font-size:18px}
.social-card span{display:block;color:#9890a8;font-size:13px;margin-top:4px}
@media(max-width:620px){.social-card{flex-direction:column;align-items:stretch}.social-card .button{width:100%;text-align:center}}
</style>
<script src="/supabase-config.js?v=3"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/site-gate.js?v=5"></script><script src="/i18n.js?v=4"></script></head>
<body><header>
  <a class="brand" href="/"><img src="/logo.png" alt="SHARDNOTE logo" class="site-logo">CS<span>2</span><b> SHARDNOTE</b></a>
</header>
<div class="dashboard-shell">
  <aside class="dashboard-sidebar">
    <div class="side-title">SHARDNOTE</div>
    <nav class="side-nav">
      <a class="side-btn" href="/"><span class="ico">⌂</span>Home</a>
      <a class="side-btn" href="/teammates/"><span class="ico">⌁</span>Find Teammates</a>
      <a class="side-btn active" href="/socials/"><span class="ico">◎</span>Socials</a>
    </nav>
  </aside>
  <main class="social-page">
  <section class="social-wrap">
    <small>S H A R D N O T E / SOCIALS</small>
    <h1>SOCIALS</h1>
    <p>Follow SHARDNOTE for updates, community news, clips, and more.</p>
    <div class="social-card">
      <div class="social-name">
        <div class="social-icon">♪</div>
        <div>
          <strong>TikTok</strong>
          <span>@shardnote.en.offical</span>
        </div>
      </div>
      <a class="button orange" href="https://www.tiktok.com/@shardnote.en.offical" target="_blank" rel="noopener">OPEN TIKTOK</a>
    </div>
    <div class="social-card">
      <div class="social-name">
        <div class="social-icon">◉</div>
        <div>
          <strong>Discord</strong>
          <span>SHARDNOTE Community</span>
        </div>
      </div>
      <a class="button orange" href="https://discord.gg/Ac2ry7zjZR" target="_blank" rel="noopener">JOIN DISCORD</a>
    </div>
    <div class="social-card">
      <div class="social-name">
        <div class="social-icon">◈</div>
        <div>
          <strong>Steam Group</strong>
          <span>SHARDNOTE Community</span>
        </div>
      </div>
      <a class="button orange" href="https://steamcommunity.com/groups/shardnotecs2" target="_blank" rel="noopener">OPEN STEAM GROUP</a>
    </div>
  </section>
  </main>
</div>
<script>
(function(){
 if(localStorage.getItem("shardnote_cookie_consent")==="accepted") return;
 const box=document.createElement("div");
 box.id="shardnote-cookie-consent";
 box.innerHTML='<div style="position:fixed;left:20px;right:20px;bottom:20px;z-index:99999;max-width:720px;margin:auto;padding:18px 20px;background:#111827;border:1px solid #374151;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);color:#fff;font-family:inherit"><div style="font-size:17px;font-weight:700;margin-bottom:6px">🍪 We use cookies</div><div style="font-size:14px;line-height:1.5;color:#cbd5e1">Shardnote uses cookies and local storage to keep you signed in, remember your preferences, and make the site work properly.</div><button id="shardnote-cookie-accept" type="button" style="margin-top:12px;padding:9px 18px;border:0;border-radius:9px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer">Accept</button></div>';
 document.body.appendChild(box);
 document.getElementById("shardnote-cookie-accept").onclick=function(){localStorage.setItem("shardnote_cookie_consent","accepted");box.remove();};
})();
</script>
</body></html>
