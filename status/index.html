<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHARDNOTE — Status</title>
<link rel="stylesheet" href="/style.css">
<style>
.status-page{min-height:calc(100vh - 74px);padding:55px 20px 80px}.status-wrap{width:min(920px,100%);margin:auto}
.status-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
.status-head h1{font:800 clamp(38px,7vw,64px)/1 Space Grotesk,Inter,sans-serif;margin:0;letter-spacing:-2px}.status-head p{color:#9890a8;margin:10px 0 0}
.overall{border:1px solid #33254b;background:rgba(15,11,27,.9);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:14px;margin-bottom:22px;transition:background .25s ease,border-color .25s ease,box-shadow .25s ease}
.overall.ok{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);box-shadow:0 0 35px rgba(52,211,153,.10)}
.overall.warn{background:rgba(245,190,55,.16);border-color:rgba(245,190,55,.45);box-shadow:0 0 35px rgba(245,190,55,.10)}
.overall.down{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.50);box-shadow:0 0 35px rgba(239,68,68,.12)}
.dot{width:12px;height:12px;border-radius:50%;background:#6f667d;box-shadow:0 0 12px rgba(111,102,125,.22);flex:none}.dot.warn{background:#f3c85b;box-shadow:0 0 18px rgba(243,200,91,.45)}.dot.down{background:#ff5d73;box-shadow:0 0 18px rgba(255,93,115,.45)}
.overall strong{font-size:15px}.overall span{display:block;color:#898198;font-size:12px;margin-top:3px}
.status-card{background:rgba(15,11,27,.84);border:1px solid #282039;border-radius:14px;margin:10px 0;overflow:hidden}
.status-row{display:flex;align-items:center;gap:14px;padding:17px 19px}.status-row+.status-row{border-top:1px solid #211a2e}
.status-info{flex:1}.status-info strong{display:block;font-size:14px}.status-info small{display:block;color:#81788e;letter-spacing:0;font-size:11px;margin-top:4px}
.status-pill{font-size:10px;font-weight:900;letter-spacing:1px;padding:6px 9px;border-radius:999px;background:#171126;color:#8e84a0}.status-pill.ok{color:#72e8a2;background:rgba(84,227,142,.08)}.status-pill.warn{color:#f3c85b;background:rgba(243,200,91,.08)}.status-pill.down{color:#ff7286;background:rgba(255,93,115,.08)}
.refresh{font-size:11px;color:#8c8299;text-align:right;margin-top:14px}.refresh button{background:none;border:0;color:#a970ff;font-weight:800;cursor:pointer}
</style></head>
<body>
<header><a class="brand" href="/"><img src="/logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><nav><a href="/socials/">SOCIALS</a><a href="/login/">LOGIN</a><a class="orange" href="/register/">REGISTER</a></nav></header>
<main class="status-page"><div class="status-wrap">
<div class="status-head"><small>SHARDNOTE.NET</small><h1>System <span>Status</span></h1><p>Live status for the SHARDNOTE website.</p></div>
<div class="overall ok" id="overall"><i class="dot" id="overallDot"></i><div><strong id="overallText">Website is operational</strong><span id="overallSub">SHARDNOTE is online.</span></div></div>
</div></main>
<footer class="site-footer">Shardnote ™️ 2026 — All rights reserved to Shardnote.net</footer>

<script>
const SUPABASE_URL="https://urgnvgchzajvnxiwyckc.supabase.co";
const SUPABASE_KEY="sb_publishable_O6bwaV-LOdtT0BeAlhph7A__mbDDtM9";
async function runChecks(){
 const dot=document.getElementById("overallDot"),title=document.getElementById("overallText"),sub=document.getElementById("overallSub");
 const overall=document.getElementById("overall");
 overall.className="overall ok";
 dot.className="dot";
 title.textContent="Website is operational";
 sub.textContent="SHARDNOTE is online.";
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_service_statuses",{
   method:"POST",cache:"no-store",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Cache-Control":"no-cache"},
   body:"{}"
  });
  const raw=await r.text();
  if(!r.ok)throw new Error("Status request failed (HTTP "+r.status+").");
  let data;try{data=JSON.parse(raw)}catch{throw new Error("Invalid status response.");}
  const website=Array.isArray(data)?data.find(x=>x.service_key==="website"):null;
  if(!website)throw new Error("Website status is unavailable.");
  if(website.manually_disabled){
   overall.className="overall down";dot.className="dot down";title.textContent="Website is offline";sub.textContent="SHARDNOTE is offline.";
  }else{
   overall.className="overall ok";dot.className="dot";title.textContent="Website is operational";sub.textContent="SHARDNOTE is online.";
  }
 }catch(e){
  overall.className="overall ok";dot.className="dot";title.textContent="Website is operational";sub.textContent="SHARDNOTE is online.";
 }

}
runChecks();setInterval(runChecks,3000);
</script>
</body></html>
