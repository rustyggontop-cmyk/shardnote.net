<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="dashboard.html"><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><a class="button" href="dashboard.html">DASHBOARD</a></header><main class="center"><section class="box"><small>SHARDNOTE / HELP</small><h1>SUPPORT</h1><p>Send a support request to the team.</p><input id="subject" maxlength="120" placeholder="Subject"><textarea id="message" maxlength="5000" placeholder="Describe your issue..." style="min-height:180px"></textarea><button id="send" class="button orange">SEND SUPPORT REQUEST</button><p id="msg"></p><hr><h2>MY TICKETS</h2><div id="tickets">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user)return;const load=async()=>{const {data}=await sb.from("support_tickets").select("subject,message,status,created_at").eq("user_id",user.id).order("created_at",{ascending:false});document.getElementById("tickets").innerHTML=(data||[]).map(t=>"<div class='member-row'><strong>"+String(t.subject).replace(/[&<>]/g,"")+"</strong><span>"+t.status.toUpperCase()+"</span></div>").join("")||"No tickets yet.";};document.getElementById("send").onclick=async()=>{const subject=document.getElementById("subject").value.trim(),message=document.getElementById("message").value.trim(),msg=document.getElementById("msg");if(!subject||!message){msg.textContent="Enter a subject and message.";return;}const {error}=await sb.from("support_tickets").insert({user_id:user.id,subject,message});msg.textContent=error?error.message:"Support request sent.";if(!error){document.getElementById("subject").value="";document.getElementById("message").value="";load();}};load();})();</script></body></html>
