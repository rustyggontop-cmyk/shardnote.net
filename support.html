<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><img src="logo.png" class="site-logo" alt="SHARDNOTE logo">CS<span>2</span><b> SHARDNOTE</b></a><div style="display:flex;align-items:center;gap:8px"><a class="button" href="dashboard.html">DASHBOARD</a><button id="logout" class="button">LOGOUT</button></div></header><div class="panel-shell"><aside class="dashboard-sidebar"><div class="side-title">SHARDNOTE</div><nav class="side-nav"><a class="side-btn" href="dashboard.html"><span class="ico">⌂</span>Overview</a><a class="side-btn" href="dashboard.html#members"><span class="ico">◉</span>Team Members</a><a class="side-btn active" href="support.html"><span class="ico">?</span>Support</a><a class="side-btn" href="dashboard.html#invites"><span class="ico">◇</span>Invites</a><a class="side-btn" href="https://steamcommunity.com/groups/shardnotecs2" target="_blank" rel="noopener"><span class="ico">◈</span>Steam Group</a><a id="support-admin-link" class="side-btn" style="display:none" href="admin.html"><span class="ico">⚙</span>Admin Panel</a></nav></aside><main class="panel-main"><div class="panel-wrap"><section class="panel-hero"><div><small>SHARDNOTE / SUPPORT</small><h1>SUPPORT CENTER</h1><p>Submit a request and follow its status from one place.</p></div></section><div class="panel-grid"><section class="panel-card"><small>NEW REQUEST</small><h2>Contact Support</h2><input id="subject" maxlength="120" placeholder="Subject"><textarea id="message" maxlength="5000" placeholder="Describe your issue..." style="min-height:190px"></textarea><button id="send" class="button orange">SEND SUPPORT REQUEST</button><p id="msg"></p></section><section class="panel-card"><small>REQUEST HISTORY</small><h2>My Tickets</h2><div id="tickets">Loading...</div></section></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html";return;}const {data:me}=await sb.from("team_members").select("role").eq("user_id",user.id).maybeSingle();if(me&&(me.role==="owner"||me.role==="admin"))document.getElementById("support-admin-link").style.display="flex";const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));const load=async()=>{const {data,error}=await sb.from("support_tickets").select("subject,message,status,created_at").eq("user_id",user.id).order("created_at",{ascending:false});document.getElementById("tickets").innerHTML=error?"Could not load tickets: "+esc(error.message):(data||[]).map(t=>"<div class='member-row'><strong>"+esc(t.subject)+"</strong><span>"+esc(t.status).toUpperCase()+"</span></div>").join("")||"No tickets yet.";};document.getElementById("send").onclick=async()=>{const subject=document.getElementById("subject").value.trim(),message=document.getElementById("message").value.trim(),msg=document.getElementById("msg");if(!subject||!message){msg.textContent="Please enter both a subject and message.";return;}msg.textContent="Sending request...";const {error}=await sb.from("support_tickets").insert({user_id:user.id,subject,message});if(error){msg.textContent="Could not send request: "+error.message;return;}msg.textContent="Support request sent successfully.";document.getElementById("subject").value="";document.getElementById("message").value="";await load();};await load();})();</script></body></html>
