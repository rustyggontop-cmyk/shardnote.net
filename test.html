<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Test — SHARDNOTE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">CS<span>2</span><b> SHARDNOTE</b></a></header><main class="center"><form class="box" id="test"><small>SHARDNOTE / EMAIL</small><h1>EMAIL TEST</h1><input id="adminKey" type="password" placeholder="Admin key" required><input id="to" type="email" placeholder="Recipient email" required><input id="subject" placeholder="Subject" value="SHARDNOTE test email" required><textarea id="message" placeholder="Message" required style="min-height:140px"></textarea><button class="button orange">SEND TEST</button><p id="msg"></p><p style="font-size:12px;opacity:.6">Email sending requires the server-side Brevo endpoint.</p></form><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const form=document.getElementById("test"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.textContent="Sending...";
 try{
  const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
  const r=await fetch(window.SUPABASE_URL+"/functions/v1/send-test-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({adminKey:document.getElementById("adminKey").value,to:document.getElementById("to").value,subject:document.getElementById("subject").value,message:document.getElementById("message").value})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error+(d.details?" — "+d.details:""));
  msg.textContent="Email sent successfully. Brevo message ID: "+(d.brevo?.messageId||"unknown");
 }catch(err){console.error(err);msg.textContent="Email failed: "+err.message;}
});
</script></main></body></html>
